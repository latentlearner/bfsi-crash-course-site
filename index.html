ancial Disclosures","tags":["capital-liquidity-and"]},{"id":"v015","front":"NII","back":"Net Interest Income","tags":["banking-metrics"]},{"id":"v016","front":"NFI","back":"Non-Fee Income (or Non-Interest Income)","tags":["banking-metrics"]},{"id":"v017","front":"NIM","back":"Net Interest Margin","tags":["banking-metrics"]},{"id":"v018","front":"CIR","back":"Cost-to-Income Ratio","tags":["banking-metrics"]},{"id":"v019","front":"ROE","back":"Return on Equity","tags":["banking-metrics"]},{"id":"v020","front":"ROA","back":"Return on Assets","tags":["banking-metrics"]},{"id":"v021","front":"NPL","back":"Non-Performing Loan","tags":["banking-metrics"]},{"id":"v022","front":"CASA","back":"Current Account and Savings Account","tags":["banking-metrics"]},{"id":"v023","front":"LDR","back":"Loan-to-Deposit Ratio","tags":["banking-metrics"]},{"id":"v024","front":"NRR","back":"Net Revenue Retention (in services contexts)","tags":["banking-metrics"]},{"id":"v025","front":"KYC","back":"Know Your Customer","tags":["operations-and-process"]},{"id":"v026","front":"CDD","back":"Customer Due Diligence","tags":["operations-and-process"]},{"id":"v027","front":"EDD","back":"Enhanced Due Diligence","tags":["operations-and-process"]},{"id":"v028","front":"AML","back":"Anti-Money Laundering","tags":["operations-and-process"]},{"id":"v029","front":"CFT","back":"Counter-Financing of Terrorism","tags":["operations-and-process"]},{"id":"v030","front":"SAR / STR","back":"Suspicious Activity / Transaction Report","tags":["operations-and-process"]},{"id":"v031","front":"PEP","back":"Politically Exposed Person","tags":["operations-and-process"]},{"id":"v032","front":"KYB","back":"Know Your Business","tags":["operations-and-process"]},{"id":"v033","front":"EOD / COB","back":"End-of-Day / Close of Business","tags":["operations-and-process"]},{"id":"v034","front":"STP","back":"Straight-Through Processing","tags":["operations-and-process"]},{"id":"v035","front":"BCP","back":"Business Continuity Planning","tags":["operations-and-process"]},{"id":"v036","front":"TPRM","back":"Third-Party Risk Management","tags":["operations-and-process"]},{"id":"v037","front":"NTB","back":"New-to-Bank","tags":["customer-and-product"]},{"id":"v038","front":"NTC","back":"New-to-Credit","tags":["customer-and-product"]},{"id":"v039","front":"HNW / UHNW","back":"High / Ultra High Net Worth","tags":["customer-and-product"]},{"id":"v040","front":"AUM","back":"Assets Under Management","tags":["customer-and-product"]},{"id":"v041","front":"RM","back":"Relationship Manager","tags":["customer-and-product"]},{"id":"v042","front":"NPS","back":"Net Promoter Score","tags":["customer-and-product"]},{"id":"v043","front":"CSAT","back":"Customer Satisfaction Score","tags":["customer-and-product"]},{"id":"v044","front":"CES","back":"Customer Effort Score","tags":["customer-and-product"]},{"id":"v045","front":"ALT","back":"Always-on, Lightning-fast, Trusted — DIB's mobile app brand","tags":["customer-and-product"]},{"id":"v046","front":"ALM","back":"Asset-Liability Management","tags":["treasury-and-markets"]},{"id":"v047","front":"FTP","back":"Funds Transfer Pricing","tags":["treasury-and-markets"]},{"id":"v048","front":"RWA","back":"Risk-Weighted Assets","tags":["treasury-and-markets"]},{"id":"v049","front":"MTM","back":"Mark-to-Market","tags":["treasury-and-markets"]},{"id":"v050","front":"HTM","back":"Held-to-Maturity","tags":["treasury-and-markets"]},{"id":"v051","front":"AFS","back":"Available-for-Sale","tags":["treasury-and-markets"]},{"id":"v052","front":"VaR","back":"Value at Risk","tags":["treasury-and-markets"]},{"id":"v053","front":"EVE","back":"Economic Value of Equity","tags":["treasury-and-markets"]},{"id":"v054","front":"Riba","back":"Interest / usury (prohibited)","tags":["islamic-banking"]},{"id":"v055","front":"Gharar","back":"Excessive uncertainty (prohibited)","tags":["islamic-banking"]},{"id":"v056","front":"Maysir","back":"Gambling / speculation (prohibited)","tags":["islamic-banking"]},{"id":"v057","front":"Halal","back":"Permissible","tags":["islamic-banking"]},{"id":"v058","front":"Haram","back":"Prohibited","tags":["islamic-banking"]},{"id":"v059","front":"Murabaha","back":"Cost-plus sale","tags":["islamic-banking"]},{"id":"v060","front":"Tawarruq","back":"Commodity Murabaha for cash","tags":["islamic-banking"]},{"id":"v061","front":"Ijara","back":"Lease / lease-to-own","tags":["islamic-banking"]},{"id":"v062","front":"Mudaraba","back":"Profit-sharing partnership","tags":["islamic-banking"]},{"id":"v063","front":"Musharaka","back":"Joint partnership","tags":["islamic-banking"]},{"id":"v064","front":"Wakala","back":"Agency contract","tags":["islamic-banking"]},{"id":"v065","front":"Salam","back":"Forward sale with advance payment","tags":["islamic-banking"]},{"id":"v066","front":"Istisna","back":"Manufacturing / construction finance","tags":["islamic-banking"]},{"id":"v067","front":"Sukuk","back":"Islamic bond (asset-backed)","tags":["islamic-banking"]},{"id":"v068","front":"Takaful","back":"Islamic insurance","tags":["islamic-banking"]},{"id":"v069","front":"Zakat","back":"Mandatory charitable contribution","tags":["islamic-banking"]},{"id":"v070","front":"Qard / Qard Hasan","back":"Interest-free loan","tags":["islamic-banking"]},{"id":"v071","front":"Wadiah","back":"Safekeeping deposit","tags":["islamic-banking"]},{"id":"v072","front":"Wa'ad","back":"Unilateral promise","tags":["islamic-banking"]},{"id":"v073","front":"Arboun","back":"Down payment","tags":["islamic-banking"]},{"id":"v074","front":"ISSC","back":"Internal Sharia Supervisory Committee","tags":["sharia-governance"]},{"id":"v075","front":"HSA","back":"Higher Sharia Authority (UAE)","tags":["sharia-governance"]},{"id":"v076","front":"AAOIFI","back":"Accounting and Auditing Organization for Islamic Financial Institutions","tags":["sharia-governance"]},{"id":"v077","front":"IFSB","back":"Islamic Financial Services Board","tags":["sharia-governance"]},{"id":"v078","front":"CIBAFI","back":"General Council for Islamic Banks and Financial Institutions","tags":["sharia-governance"]},{"id":"v079","front":"IIFM","back":"International Islamic Financial Market","tags":["sharia-governance"]},{"id":"v080","front":"CBUAE","back":"Central Bank of the UAE","tags":["regulatory-and-ecosystem"]},{"id":"v081","front":"DIFC","back":"Dubai International Financial Centre","tags":["regulatory-and-ecosystem"]},{"id":"v082","front":"DFSA","back":"Dubai Financial Services Authority","tags":["regulatory-and-ecosystem"]},{"id":"v083","front":"ADGM","back":"Abu Dhabi Global Market","tags":["regulatory-and-ecosystem"]},{"id":"v084","front":"FSRA","back":"Financial Services Regulatory Authority (ADGM)","tags":["regulatory-and-ecosystem"]},{"id":"v085","front":"SCA","back":"Securities and Commodities Authority (UAE)","tags":["regulatory-and-ecosystem"]},{"id":"v086","front":"FATF","back":"Financial Action Task Force","tags":["regulatory-and-ecosystem"]},{"id":"v087","front":"FIU","back":"Financial Intelligence Unit","tags":["regulatory-and-ecosystem"]},{"id":"v088","front":"NDMO","back":"National Data Management Office (KSA equivalent in scope)","tags":["regulatory-and-ecosystem"]},{"id":"v089","front":"PDPL","back":"Personal Data Protection Law","tags":["regulatory-and-ecosystem"]},{"id":"v090","front":"DMTT","back":"Domestic Minimum Top-Up Tax","tags":["regulatory-and-ecosystem"]},{"id":"v091","front":"MDM","back":"Master Data Management","tags":["technology-stack"]},{"id":"v092","front":"DMO","back":"Data Management Office","tags":["technology-stack"]},{"id":"v093","front":"DGC","back":"Data Governance Council","tags":["technology-stack"]},{"id":"v094","front":"MLOps","back":"Machine Learning Operations","tags":["technology-stack"]},{"id":"v095","front":"ETL","back":"Extract, Transform, Load","tags":["technology-stack"]},{"id":"v096","front":"ELT","back":"Extract, Load, Transform","tags":["technology-stack"]},{"id":"v097","front":"DWH","back":"Data Warehouse","tags":["technology-stack"]},{"id":"v098","front":"API","back":"Application Programming Interface","tags":["technology-stack"]},{"id":"v099","front":"BRD","back":"Business Requirements Document","tags":["technology-stack"]},{"id":"v100","front":"UAT","back":"User Acceptance Testing","tags":["technology-stack"]},{"id":"v101","front":"SLA","back":"Service Level Agreement","tags":["technology-stack"]},{"id":"v102","front":"OKR","back":"Objectives and Key Results","tags":["technology-stack"]},{"id":"v103","front":"CRM","back":"Customer Relationship Management","tags":["technology-stack"]},{"id":"v104","front":"BI","back":"Business Intelligence","tags":["technology-stack"]}]};
  </script>
  <script>
    (function() {
  'use strict';

  function createState(initial) {
    var subscribers = {};
    var state = JSON.parse(JSON.stringify(initial));

    function getPath(obj, pathArr) {
      var cur = obj;
      for (var i = 0; i < pathArr.length; i++) {
        if (cur == null) return undefined;
        cur = cur[pathArr[i]];
      }
      return cur;
    }

    function setPath(obj, pathArr, value) {
      var cur = obj;
      for (var i = 0; i < pathArr.length - 1; i++) {
        if (cur[pathArr[i]] == null || typeof cur[pathArr[i]] !== 'object') {
          cur[pathArr[i]] = {};
        }
        cur = cur[pathArr[i]];
      }
      cur[pathArr[pathArr.length - 1]] = value;
    }

    function notify(path) {
      var parts = path.split('.');
      for (var i = parts.length; i >= 1; i--) {
        var prefix = parts.slice(0, i).join('.');
        if (subscribers[prefix]) {
          subscribers[prefix].forEach(function(cb) {
            try { cb(state); } catch(e) { console.error('Subscriber error:', e); }
          });
        }
      }
      if (subscribers['*']) {
        subscribers['*'].forEach(function(cb) {
          try { cb(state); } catch(e) { console.error('Subscriber error:', e); }
        });
      }
    }

    return {
      get: function(path) {
        if (!path) return state;
        return getPath(state, path.split('.'));
      },
      set: function(path, value) {
        setPath(state, path.split('.'), value);
        notify(path);
      },
      subscribe: function(path, callback) {
        if (!subscribers[path]) subscribers[path] = [];
        subscribers[path].push(callback);
      },
      getState: function() {
        return state;
      }
    };
  }

  function findSubmoduleById(id, modules) {
    for (var i = 0; i < modules.length; i++) {
      for (var j = 0; j < modules[i].submodules.length; j++) {
        if (modules[i].submodules[j].id === id) {
          return { module: modules[i], submodule: modules[i].submodules[j] };
        }
      }
    }
    return null;
  }

  function getFlatSubmodules(modules) {
    var flat = [];
    for (var i = 0; i < modules.length; i++) {
      for (var j = 0; j < modules[i].submodules.length; j++) {
        flat.push(modules[i].submodules[j]);
      }
    }
    return flat;
  }

  function getPrevNext(subId, modules) {
    var flat = getFlatSubmodules(modules);
    var idx = -1;
    for (var k = 0; k < flat.length; k++) {
      if (flat[k].id === subId) { idx = k; break; }
    }
    return {
      prev: idx > 0 ? flat[idx - 1] : null,
      next: idx < flat.length - 1 ? flat[idx + 1] : null
    };
  }

  function renderRightSidebar(store) {
    var state = store.getState();
    var currentView = state.currentView;
    var container = document.getElementById('right-sidebar-content');
    if (!container) return;

    var html = '<div class="rail-inner">';

    if (currentView.type === 'submodule' && currentView.id) {
      var result = findSubmoduleById(currentView.id, state.course.modules);
      if (result) {
        html += '<div class="rail-group">';
        html += '<h4>In this module</h4>';
        html += '<nav class="toc">';
        result.module.submodules.forEach(function(sub) {
          var isCurrent = sub.id === currentView.id;
          html += '<a href="#' + sub.id + '"' + (isCurrent ? ' class="active"' : '') + '>' + escapeHtml(sub.title) + '</a>';
        });
        html += '</nav></div>';
      }

      var nav = getPrevNext(currentView.id, state.course.modules);
      if (nav.prev || nav.next) {
        html += '<div class="rail-group">';
        html += '<h4>Navigation</h4>';
        html += '<nav class="toc">';
        if (nav.prev) {
          html += '<a href="#' + nav.prev.id + '">\u2190 ' + escapeHtml(nav.prev.title) + '</a>';
        }
        if (nav.next) {
          html += '<a href="#' + nav.next.id + '">' + escapeHtml(nav.next.title) + ' \u2192</a>';
        }
        html += '</nav></div>';
      }
    } else if (currentView.type === 'flashcards') {
      html += '<div class="rail-group"><h4>Flashcards</h4><p class="rail-help">Review your saved deck \u2014 flip each card, then mark whether you knew it.</p></div>';
    } else if (currentView.type === 'quiz') {
      html += '<div class="rail-group"><h4>Quiz</h4><p class="rail-help">Answer each question to check your understanding. You need 70% to pass.</p></div>';
    }

    html += '<div class="rail-group">';
    html += '<h4>Your progress</h4>';
    html += '<button id="export-btn" class="rail-btn">Export progress</button>';
    html += '<button id="import-btn" class="rail-btn">Import progress</button>';
    html += '<button id="reset-all-btn" class="rail-btn danger">Reset all progress</button>';
    html += '<input type="file" id="import-file-input" style="display:none" accept=".json">';
    html += '<span id="import-error" class="inline-error mt-1 hidden"></span>';
    html += '</div></div>';

    container.innerHTML = html;

    var resetBtn = document.getElementById('reset-all-btn');
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
          Progress.resetAll();
          renderApp();
        }
      });
    }

    var exportBtn = document.getElementById('export-btn');
    if (exportBtn) {
      exportBtn.addEventListener('click', function() {
        Progress.exportProgress();
      });
    }

    var importBtn = document.getElementById('import-btn');
    var fileInput = document.getElementById('import-file-input');
    if (importBtn && fileInput) {
      importBtn.addEventListener('click', function() {
        fileInput.click();
      });
      fileInput.addEventListener('change', function() {
        var file = fileInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
          var result = Progress.importProgress(e.target.result);
          if (result.success) {
            renderApp();
          } else {
            var errEl = document.getElementById('import-error');
            if (errEl) {
              errEl.textContent = result.error;
              errEl.classList.remove('hidden');
              setTimeout(function() { errEl.classList.add('hidden'); }, 5000);
            }
          }
        };
        reader.readAsText(file);
        fileInput.value = '';
      });
    }
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function renderTopProgress(store) {
    var state = store.getState();

        if (i < mod.submodules.length - 1) {
          return '#' + mod.submodules[i + 1].id;

var FlashcardComponent = (function() {
  'use strict';

  var currentCards = [];
  var currentIndex = 0;
  var known = 0;
  var forgot = 0;
  var flipped = false;
  var cardCount = 20;

  function init(store) {}

      return;
    }

    if (!sessionStarted) {
      renderSetup(deck);
      return;
    }

    var html = '<div class="reader-inner"><div class="flash-wrap">';
    html += '<h2 class="flash-title">Vocabulary Flashcards</h2>';
    html += '<p class="flash-sub">' + currentCards.length + ' cards \u00B7 Known ' + known + ' \u00B7 Forgot ' + forgot + '</p>';

    if (currentIndex < currentCards.length) {
      var card = currentCards[currentIndex];
      html += '<div id="flashcard" class="flash-card">';
      if (flipped) {
        html += '<div><div class="back">' + escapeHtml(card.back) + '</div>';
        html += '<div class="tags">' + (card.tags ? escapeHtml(card.tags.join(', ')) : '') + '</div></div>';
      } else {
        html += '<div><div class="front">' + escapeHtml(card.front) + '</div></div>';
        html += '<span class="hint">click to flip</span>';
      }
      html += '</div>';

      if (flipped) {
        html += '<div class="flash-actions">';
        html += '<button id="flashcard-forgot" class="flash-btn forgot">Forgot</button>';
        html += '<button id="flashcard-knew" class="flash-btn knew">Knew it</button>';
        html += '</div>';
      }
    } else {
      html += '<div class="flash-done">';
      html += '<h3 class="flash-title" style="font-size:22px;">Session complete</h3>';
      html += '<div style="margin-bottom:4px;">Known: <strong class="flash-stat" style="color:var(--ok);">' + known + '</strong></div>';
      html += '<div style="margin-bottom:16px;">Forgot: <strong class="flash-stat" style="color:var(--accent);">' + forgot + '</strong></div>';
      html += '<button id="flashcard-restart" class="btn-primary">Start new session</button>';
      html += '</div>';
    }

    html += '</div></div>';
    main.innerHTML = html;

    bindEvents();
  }

  function bindEvents() {
    var card = document.getElementById('flashcard');
    if (card) {
      card.addEventListener('click', function() {
        flip();
      });
    }
    var forgotBtn = document.getElementById('flashcard-forgot');
    if (forgotBtn) {
      forgotBtn.addEventListener('click', function() {
        answer(false);
      });
    }
    var knewBtn = document.getElementById('flashcard-knew');
    if (knewBtn) {
      knewBtn.addEventListener('click', function() {
        answer(true);
      });
    }
    var restartBtn = document.getElementById('flashcard-restart');
    if (restartBtn) {
      restartBtn.addEventListener('click', function() {
        restart();

  function escapeHtml(str) {

  }

    html += '<h2 class="flash-title">Vocabulary Flashcards</h2>';
    html += '<p class="flash-sub">' + deck.length + ' cards available</p>';
    html += '<label class="rail-group" style="display:block;"><span style="display:block; font-family:var(--sans); font-size:13px; color:var(--ink-2); margin-bottom:8px;">Cards per session</span>';

    });
    html += '</select></label>';
    html += '<button id="flashcard-start" class="btn-primary">Start session →</button>';

      v: 1,
      completedSubmodules: [],
      quizScores: {},
      lastVisited: null,
      darkMode: false

  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaults();
      var data = JSON.parse(raw);
      if (!data || data.v !== 1) {
        console.warn('bfsi-course-state version mismatch, resetting');
        return defaults();
      }
      return {
        v: 1,
        completedSubmodules: data.completedSubmodules || [],
        quizScores: data.quizScores || {},
        lastVisited: data.lastVisited || null,
        darkMode: !!data.darkMode
      };
    } catch(e) {
      console.warn('Failed to load progress, resetting:', e);
      return defaults();
    }
  }

  function save(progress) {
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
      writeSync(progress);
    }, DEBOUNCE_MS);
  }

  function writeSync(progress) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch(e) {
      console.warn('Failed to save progress:', e);
      var notification = document.getElementById('progress-save-error');
      if (notification) {
        notification.classList.remove('hidden');
        setTimeout(function() { notification.classList.add('hidden'); }, 3000);
      }
    }
  }

  function markSubmoduleComplete(submoduleId) {
    var store = window.__STORE__;
    var completed = store.get('progress.completedSubmodules') || [];
    if (completed.indexOf(submoduleId) === -1) {
      completed = completed.concat([submoduleId]);
      store.set('progress.completedSubmodules', completed);
    }
  }

  function isSubmoduleComplete(submoduleId) {
    var store = window.__STORE__;
    var completed = store.get('progress.completedSubmodules') || [];
    return completed.indexOf(submoduleId) !== -1;
  }

  function recordQuizScore(moduleId, score) {
    var store = window.__STORE__;
    var scores = store.get('progress.quizScores') || {};
    var existing = scores[moduleId] || { best: 0, last: 0, attempts: 0, passedAt: null };
    scores[moduleId] = {
      best: Math.max(existing.best, score),
      last: score,
      attempts: existing.attempts + 1,
      passedAt: score >= 70 ? (existing.passedAt || Date.now()) : existing.passedAt
    };
    store.set('progress.quizScores', scores);
  }

  function updateLastVisited(moduleId, submoduleId) {
    var store = window.__STORE__;
    store.set('progress.lastVisited', { moduleId: moduleId, submoduleId: submoduleId });
  }

    var json = JSON.stringify(progress, null, 2);

    a.href = url;
    a.download = 'bfsi-course-progress.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

      data = JSON.parse(jsonStr);

      return { success: false, error: 'Invalid JSON file. Please select a valid progress export file.' };
    }

      return { success: false, error: 'Unsupported or corrupted progress file. Expected version 1.' };
    }

    if (!Array.isArray(data.completedSubmodules)) {
      return { success: false, error: 'Progress file is missing required data (completedSubmodules). State has not been modified.' };

    html += '</div>';

    html += '<p class="quiz-sub" style="margin-top:18px;">Retaking the quiz starts a fresh attempt. Your best score is kept.</p>';

    html += '<div class="quiz-actions">';
    html += '<button id="quiz-start-btn" class="btn-primary">Retake quiz →</button>';
    var modules = state.course.modules;
    var currentModIdx = modules.findIndex(function(m) { return m.id === moduleId; });
    if (passed && currentModIdx >= 0 && currentModIdx < modules.length - 1) {
      var nextMod = modules[currentModIdx + 1];
      html += '<a href="#' + nextMod.submodules[0].id + '" class="btn-secondary">Next module →</a>';
    }
    html += '</div>';
    html += '</div></div>';

    main.innerHTML = html;
    main.scrollTop = 0;

    document.getElementById('quiz-start-btn').addEventListener('click', function() {
      beginQuiz(quiz, moduleId);
    });
  }

  function quizHeader(idx, total) {
    return '<div class="q-eyebrow">Check your understanding</div>' +
      '<h2 class="quiz-title">' + escapeHtml(session.quiz.title) + '</h2>' +
      '<p class="quiz-sub">Question ' + (idx + 1) + ' of ' + total + '</p>';
  }

  function renderCurrentQuestion() {
    if (!session) return;
    var main = document.getElementById('content');
    var q = session.quiz.questions[session.currentIndex];
    var total = session.quiz.questions.length;
    var idx = session.currentIndex;
    var inputType = q.type === 'multi' ? 'checkbox' : 'radio';

    var html = '<div class="reader-inner"><div class="quiz-wrap">';
    html += quizHeader(idx, total);

    html += '<div class="quiz-q">';
    html += '<div class="qnum">Question ' + (idx + 1) + (q.type === 'multi' ? ' · select all that apply' : '') + '</div>';
    html += '<div class="qtext">' + escapeHtml(q.question) + '</div>';
    html += '<div class="quiz-choices">';
    q.options.forEach(function(opt, oi) {
      html += '<label class="choice">' +
        '<input type="' + inputType + '" name="answer" value="' + oi + '">' +
        '<span class="marker">' + letter(oi) + '</span>' +
        '<span>' + escapeHtml(opt) + '</span></label>';
    });
    html += '</div></div>';

    html += '<div class="quiz-actions">';
    html += '<button id="quiz-submit-btn" class="btn-primary">Submit answer</button>';
    html += '<span id="quiz-answer-error" class="inline-error hidden">Please select an answer.</span>';
    html += '</div>';
    html += '</div></div>';

    main.innerHTML = html;
    main.scrollTop = 0;

    document.getElementById('quiz-submit-btn').addEventListener('click', function() {
      handleAnswerSubmit(session, q);
    });
  }

  function handleAnswerSubmit(session, q) {
    var form = document.getElementById('content');
    var inputs = Array.from(form.querySelectorAll('input[name="answer"]:checked'));
    var selectedValues = inputs.map(function(el) { return parseInt(el.value, 10); });

    if (selectedValues.length === 0) {
      var errEl = document.getElementById('quiz-answer-error');
      if (errEl) errEl.classList.remove('hidden');
      return;
    }

    var isCorrect = false;
    if (q.type === 'single' || q.type === 'boolean') {
      isCorrect = selectedValues.length === 1 && selectedValues[0] === q.correctIndex;
    } else if (q.type === 'multi') {
      isCorrect = q.correctIndexes.length === selectedValues.length &&
        q.correctIndexes.every(function(v) { return selectedValues.indexOf(v) !== -1; });
    }

    session.answers[session.currentIndex] = isCorrect;
    session.selected[session.currentIndex] = selectedValues;
    if (isCorrect) session.correctCount++;

    renderFeedback(q, isCorrect);
  }

  function choiceStatesHtml(q, picked) {
    var correct = correctSet(q);
    var html = '<div class="quiz-choices">';
    q.options.forEach(function(opt, oi) {
      var cls = 'choice';
      if (correct.indexOf(oi) !== -1) cls += ' correct';
      else if (picked.indexOf(oi) !== -1) cls += ' incorrect';
      html += '<div class="' + cls + '">' +
        '<span class="marker">' + letter(oi) + '</span>' +
        '<span>' + escapeHtml(opt) + '</span></div>';
    });
    html += '</div>';
    return html;
  }

  function renderFeedback(q, isCorrect) {
    var main = document.getElementById('content');
    var idx = session.currentIndex;
    var total = session.quiz.questions.length;
    var picked = session.selected[idx] || [];

    var html = '<div class="reader-inner"><div class="quiz-wrap">';
    html += quizHeader(idx, total);

    html += '<div class="quiz-q ' + (isCorrect ? 'feedback-correct' : 'feedback-incorrect') + '">';
    html += '<div class="qtext">' + escapeHtml(q.question) + '</div>';
    html += choiceStatesHtml(q, picked);
    html += '<div class="quiz-feedback">';
    html += '<span class="verdict ' + (isCorrect ? 'ok' : 'no') + '">' + (isCorrect ? 'Correct' : 'Incorrect') + '</span>';
    if (q.explanation) {
      html += '<div class="explain">' + escapeHtml(q.explanation) + '</div>';
    }
    html += '</div></div>';

    html += '<div class="quiz-actions">';
    if (idx + 1 < total) {
      html += '<button id="quiz-next-btn" class="btn-primary">Next question →</button>';
    } else {
      html += '<button id="quiz-finish-btn" class="btn-primary">View results →</button>';
    }
    html += '</div>';
    html += '</div></div>';

    main.innerHTML = html;
    main.scrollTop = 0;

    var btnId = idx + 1 < total ? 'quiz-next-btn' : 'quiz-finish-btn';
    document.getElementById(btnId).addEventListener('click', function() {
      session.currentIndex++;
      if (session.currentIndex >= total) {
        renderResults();
      } else {
        renderCurrentQuestion();
      }
    });
  }

  function renderResults() {
    var store = window.__STORE__;
    var state = store.getState();
    var main = document.getElementById('content');
    var total = session.quiz.questions.length;
    var correct = session.correctCount;
    var score = Math.round((correct / total) * 100);
    var passed = score >= 70;

    var html = '<div class="reader-inner"><div class="quiz-wrap">';
    html += '<div class="q-eyebrow">Results</div>';
    html += '<h2 class="quiz-title">' + escapeHtml(session.quiz.title) + '</h2>';

    html += '<div class="result-banner ' + (passed ? 'pass' : 'fail') + '">';
    html += '<div class="result-score">' + score + '%</div>';
    html += '<div class="result-detail">' + (passed ? 'Passed' : 'Not passed — 70% required') + ' · ' + correct + ' of ' + total + ' correct</div>';
    html += '</div>';

    session.quiz.questions.forEach(function(q, qi) {
      var isCorrect = session.answers[qi];
      var picked = session.selected[qi] || [];
      html += '<div class="quiz-q ' + (isCorrect ? 'feedback-correct' : 'feedback-incorrect') + '" style="margin-top:18px;">';
      html += '<div class="qnum">Question ' + (qi + 1) + '</div>';
      html += '<div class="qtext">' + escapeHtml(q.question) + '</div>';
      html += choiceStatesHtml(q, picked);
      if (q.explanation) {
        html += '<div class="quiz-feedback"><div class="explain">' + escapeHtml(q.explanation) + '</div></div>';
      }
      html += '</div>';
    });

    html += '<div class="quiz-actions" style="margin-top:24px;">';
    html += '<button id="quiz-retake-btn" class="btn-primary">Retake quiz →</button>';
    var modules = state.course.modules;
    var currentModIdx = modules.findIndex(function(m) { return m.id === session.moduleId; });
    if (currentModIdx >= 0 && currentModIdx < modules.length - 1) {
      var nextMod = modules[currentModIdx + 1];
      html += '<a href="#' + nextMod.submodules[0].id + '" class="btn-secondary">Next module →</a>';
    }
    html += '</div>';
    html += '</div></div>';

    main.innerHTML = html;
    main.scrollTop = 0;

    Progress.recordQuizScore(session.moduleId, score);

    var retakeQuiz = session.quiz;
    var retakeModuleId = session.moduleId;
    var retakeBtn = document.getElementById('quiz-retake-btn');
    if (retakeBtn) {
      retakeBtn.addEventListener('click', function() {
        beginQuiz(retakeQuiz, retakeModuleId);
      });
    }
  }

  return { init: init, render: render };
})();

var SearchComponent = (function() {
  'use strict';

  function init(store) {
    var overlay = document.getElementById('search-overlay');
    var input = document.getElementById('search-input');

    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) {
        overlay.classList.add('hidden');
      }
    });

    input.addEventListener('input', function() {
      var query = input.value.trim().toLowerCase();
      var results = document.getElementById('search-results');
      if (!query || query.length < 2) {
        results.innerHTML = '';
        return;
      }

      var modules = store.get('course.modules');
      var matches = [];
      for (var i = 0; i < modules.length; i++) {
        for (var j = 0; j < modules[i].submodules.length; j++) {
          var sub = modules[i].submodules[j];
          var text = sub.title + ' ' + sub.bodyHtml.replace(/<[^>]+>/g, ' ');
          var lower = text.toLowerCase();
          if (lower.indexOf(query) !== -1) {
            var idx = lower.indexOf(query);
            var start = Math.max(0, idx - 40);
            var end = Math.min(text.length, idx + query.length + 40);
            var snippet = (start > 0 ? '...' : '') + text.substring(start, end) + (end < text.length ? '...' : '');
            matches.push({ sub: sub, module: modules[i], snippet: snippet });
            if (matches.length >= 20) break;
          }
        }
        if (matches.length >= 20) break;
      }

      if (matches.length === 0) {
        results.innerHTML = '<div class="search-empty">No results found.</div>';
        return;
      }

      var html = '';
      matches.forEach(function(m) {
        html += '<a href="#' + m.sub.id + '" class="search-result">';
        html += '<div class="title">' + m.sub.title + '</div>';
        html += '<div class="path">Module ' + m.module.id.replace('m', '') + ' · ' + m.module.title + '</div>';
        html += '<div class="snippet">' + m.snippet.substring(0, 100) + '</div>';
        html += '</a>';
      });
      results.innerHTML = html;

      results.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', function() {
          overlay.classList.add('hidden');
        });
      });
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        overlay.classList.add('hidden');
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        toggle();
      }
    });
  }

  function toggle() {
    var overlay = document.getElementById('search-overlay');
    overlay.classList.toggle('hidden');
    if (!overlay.classList.contains('hidden')) {
      document.getElementById('search-input').focus();
    }
  }

  return { init: init, toggle: toggle };
})();
var Sidebar = (function() {
  'use strict';

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function init(store) {
    var mobileMenu = document.getElementById('mobile-menu');

    document.getElementById('search-toggle').addEventListener('click', function() {
      SearchComponent.toggle();
    });

    var hamburgerBtn = document.getElementById('hamburger-btn');
    if (hamburgerBtn) {
      hamburgerBtn.addEventListener('click', function() {
        mobileMenu.classList.toggle('hidden');
      });
    }

    mobileMenu.addEventListener('click', function(e) {
      if (e.target === mobileMenu) {
        mobileMenu.classList.add('hidden');
      }
    });
  }

  function bindEvents() {
    var sidebarEl = document.getElementById('sidebar-content');
    var mobileSidebar = document.getElementById('mobile-sidebar-content');

    function bindContainer(container) {
      if (!container) return;
      var toggles = container.querySelectorAll('[data-module-toggle]');
      toggles.forEach(function(toggle) {
        toggle.addEventListener('click', function() {
          var moduleId = toggle.getAttribute('data-module-toggle');
          var target = document.getElementById('module-' + moduleId);
          if (target) target.classList.toggle('hidden');
        });
      });
    }

    bindContainer(sidebarEl);
    bindContainer(mobileSidebar);
  }

  function render() {
    var store = window.__STORE__;
    var state = store.getState();
    var modules = state.course.modules;
    var currentView = state.currentView;
    var completedSubmodules = state.progress.completedSubmodules || [];
    var quizScores = state.progress.quizScores || {};

    var html = '<div class="sidebar-inner">';
    html += '<p class="side-label">Modules</p>';

    modules.forEach(function(mod) {
      var subs = mod.submodules || [];
      var doneCount = subs.filter(function(s) { return completedSubmodules.indexOf(s.id) !== -1; }).length;
      var allComplete = subs.length > 0 && doneCount === subs.length;
      var partial = doneCount > 0 && !allComplete;
      var pct = subs.length ? Math.round((doneCount / subs.length) * 100) : 0;
      var isCurrentModule = currentView.type === 'submodule' && currentView.id && currentView.id.startsWith(mod.id);
      var isCurrentQuiz = currentView.type === 'quiz' && currentView.id === mod.id;
      var isActive = isCurrentModule || isCurrentQuiz;
      var quizScore = quizScores[mod.id];
      var passed = quizScore && quizScore.passedAt;

      var ringCls = allComplete ? 'mod-progress done' : (partial ? 'mod-progress partial' : 'mod-progress');
      var ringStyle = partial ? ' style="--p: ' + pct + '%"' : '';

      html += '<div class="mod">';
      html += '<div class="mod-head' + (isActive ? ' active' : '') + '" data-module-toggle="' + mod.id + '">';
      html += '<span class="' + ringCls + '"' + ringStyle + '></span>';
      html += '<span class="mod-title"><span class="num">' + mod.id.replace('m', '') + '</span> ' + escapeHtml(mod.title) + '</span>';
      if (passed) {
        html += '<span class="mod-badge">Passed</span>';
      } else {
        html += '<span class="min">' + mod.estimatedMinutes + 'm</span>';
      }
      html += '</div>';

      html += '<div id="module-' + mod.id + '" class="lesson-list' + (isActive ? '' : ' hidden') + '">';
      subs.forEach(function(sub) {
        var isCurrent = currentView.type === 'submodule' && currentView.id === sub.id;
        var isComplete = completedSubmodules.indexOf(sub.id) !== -1;
        var readingTime = Math.max(1, Math.round(sub.wordCount / 200));
        html += '<a href="#' + sub.id + '" class="lesson-item' + (isComplete ? ' done' : '') + (isCurrent ? ' active' : '') + '">' +
          '<span class="dot"></span>' +
          '<span class="lname">' + escapeHtml(sub.title) + '</span>' +
          '<span class="min">' + readingTime + 'm</span></a>';
      });

      var quizUnlocked = allComplete;
      html += '<a href="#quiz-' + mod.id + '" class="quiz-link ' + (quizUnlocked ? 'available' : 'locked') + '">' +
        '<svg class="i" viewBox="0 0 24 24"><path d="M9 11l3 3 7-7"></path><path d="M21 12a9 9 0 11-9-9"></path></svg>' +
        '<span>Module quiz</span>' +
        (!quizUnlocked ? '<span class="note">\u00B7 finish lessons first</span>' : '') + '</a>';

      html += '</div></div>';
    });

    var allModuleIds = modules.map(function(m) { return m.id; });
    var allQuizzesPassed = allModuleIds.length > 0 && allModuleIds.every(function(mid) {
      var score = quizScores[mid];
      return score && score.passedAt;
    });
    var unpassed = allModuleIds.filter(function(mid) {
      var score = quizScores[mid];
      return !(score && score.passedAt);
    });

    html += '<div class="side-section">';
    html += '<a href="#quiz-final" class="side-link ' + (allQuizzesPassed ? 'featured' : 'locked') + '">' +
      '<svg class="i" viewBox="0 0 24 24"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.7 6.6L12 16.9 6.1 20.3l1.7-6.6L2.6 9.3l6.8-.5z"></path></svg>' +
      '<span>Final Assessment</span></a>';
    if (!allQuizzesPassed && unpassed.length > 0 && unpassed.length < 11) {
      html += '<p class="side-note">Pass all 11 module quizzes to unlock.</p>';
    }
    html += '<a href="#flashcards" class="side-link">' +
      '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"></rect><path d="M7 5V3h12a2 2 0 0 1 2 2v12h-2"></path></svg>' +
      '<span>Flashcards</span></a>';
    html += '</div>';

    html += '</div>';

    var sidebarEl = document.getElementById('sidebar-content');
    if (sidebarEl) sidebarEl.innerHTML = html;

    var mobileSidebar = document.getElementById('mobile-sidebar-content');
    if (mobileSidebar) mobileSidebar.innerHTML = html;

    bindEvents();
  }

  return { init: init, render: render };
})();
  </script>
